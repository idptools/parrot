[build-system]
requires = ["setuptools>=61", "versioningit~=2.0"]
build-backend = "setuptools.build_meta"


[project]
name = "idptools-parrot"
dynamic = ["version"]
description = "Train neural networks (bidirectional LSTMs, CNNs, U-Nets, transformers) and simple baseline models that map protein sequences to per-sequence or per-residue values, behind an easy-to-use command-line interface. With only a datafile of sequences and values, PARROT trains, optimizes and tests a network, which can then predict values for new sequences."
authors = [
    {name = "Dan Griffith", email = "degriffith@wustl.edu"},
	{name = "Alex Holehouse", email = "alex.holehouse@wustl.edu"}
]

license = {text = "MIT"}
readme = "README.md"  
requires-python = ">=3.11"

# add in as needed. Minimum numpy/torch versions are stable releases from mid-2025;
# numpy 2.3 is also the first numpy release that requires Python 3.11.
dependencies = [
    "numpy>=2.3",
    "scipy",
    "torch>=2.8",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]
# parrot-optimize no longer needs extra packages; the extra is kept so older install commands still work
optimize = []
# Protein language model encodings: ESM-2 (e.g. --encode esm2_t12_35M_UR50D) and ESM C (--encode esmc_300m).
# Do not also install Meta's fair-esm alongside esm: both use the import name `esm`.
plm = ["transformers>=4.40", "h5py>=3.10"]
esmc = ["esm>=3.1", "h5py>=3.10"]

# The command-line tools
[project.scripts]
parrot-cvsplit = "parrot.scripts.parrot_cvsplit:main"
parrot-optimize = "parrot.scripts.parrot_optimize:main"
parrot-train = "parrot.scripts.parrot_train:main"
parrot-predict = "parrot.scripts.parrot_predict:main"
parrot-preprocess = "parrot.scripts.parrot_preprocess:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
namespaces = true
where = ["."]
include = ["parrot", "parrot.*"]  # Discover all sub-packages inside the main package

[tool.setuptools.package-data]
parrot = [
    "py.typed"
]

# Run the tests against the source tree in this repository (not an installed copy)
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["*/tests/*", "parrot/_version.py"]

# PARROT's code is written to lines of at most 120 characters
[tool.ruff]
line-length = 120

[tool.mypy]
files = ["parrot"]

# These packages do not ship type information
[[tool.mypy.overrides]]
module = ["sklearn.*", "h5py", "transformers", "esm.*", "versioningit"]
ignore_missing_imports = true

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
# The method key:
method = "git"  # <- The method name
# Parameters to pass to the method:
match = ["*"]
default-tag = "1.0.0"

[tool.versioningit.write]
file = "parrot/_version.py"
